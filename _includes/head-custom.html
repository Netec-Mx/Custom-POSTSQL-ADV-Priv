<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  document.querySelectorAll(".language-mermaid").forEach((bloque) => {
    const codigo = bloque.querySelector("code");
    if (!codigo) return;

    const diagrama = document.createElement("pre");
    diagrama.className = "mermaid";
    diagrama.textContent = codigo.textContent;
    bloque.replaceWith(diagrama);
  });

  mermaid.initialize({ startOnLoad: false });
  await mermaid.run({ querySelector: ".mermaid" });
</script>
